name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --all-groups
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pyright
      - run: uv run --no-sync pytest

  integration:
    name: Integration (MonetDB ${{ matrix.monetdb-version }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        monetdb-version: ["11.55.7-2"]
    services:
      monetdb:
        image: wlaur/monetdb-container:${{ matrix.monetdb-version }}
        ports:
          - 50000:50000
        env:
          MDB_DB_ADMIN_PASS: monetdb
          MDB_CREATE_DBS: test
    env:
      MONETDB_TEST_URI: monetdb://monetdb:monetdb@localhost:50000/test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
      - run: uv sync --locked --all-groups
      - name: Wait for MonetDB
        run: |
          for _ in $(seq 1 60); do
            if uv run --no-sync python -c "
          from adbc_driver_monetdb import dbapi
          dbapi.connect('$MONETDB_TEST_URI').close()
          "; then exit 0; fi
            sleep 2
          done
          echo "MonetDB did not become ready" >&2
          exit 1
      - name: Integration tests
        run: uv run --no-sync pytest tests -m integration
      # Reported, not yet gated: the compliance suite still has known failures
      # (see README, "Dialect compliance suite"). Flip continue-on-error off
      # once it is green so regressions block the merge.
      - name: SQLAlchemy dialect compliance suite
        continue-on-error: true
        run: |
          uv run --no-sync pytest suite -o addopts="" \
            --dburi "$MONETDB_TEST_URI"

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
      - run: uv build
      - name: Smoke-test wheel
        shell: bash
        run: |
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          wheel=$(realpath "$wheel")
          cd "$RUNNER_TEMP"
          uv run --isolated --no-project --python 3.13 --with "$wheel" \
            python -c "from sqlalchemy.dialects import registry; assert all(registry.load(name).name == 'monetdb' for name in ('monetdb', 'monetdb.adbc', 'monetdbs', 'monetdbs.adbc'))"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, integration, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sqlalchemy-monetdb-adbc/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
