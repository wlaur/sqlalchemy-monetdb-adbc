services:
  monetdb:
    # Native ARM64 Dec2025-SP4 image recipe: https://github.com/wlaur/monetdb-container
    image: wlaur/monetdb-container:11.55.9-1@sha256:b7238498164cd26a0b7bd9391d51948dca5c69f490f888186d3204320abaecf7
    ports:
      - "50001:50000"
    environment:
      MDB_DB_ADMIN_PASS: monetdb
      MDB_CREATE_DBS: test
    tmpfs:
      - /var/monetdb5/dbfarm:rw,size=${MONETDB_DISK_LIMIT:-2g},mode=0777
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/50000"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 5s
