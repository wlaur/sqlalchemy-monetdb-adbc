services:
  monetdb:
    # Native ARM64 Dec2025-SP3 image recipe: https://github.com/wlaur/monetdb-container
    image: wlaur/monetdb-container:11.55.7-2@sha256:22dd41bd10fd7136ca1ef6afaec5cf0c1670f16a84b80785a5fee12aac480eb4
    ports:
      - "50001:50000"
    environment:
      MDB_DB_ADMIN_PASS: monetdb
      MDB_CREATE_DBS: test
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/50000"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 5s
