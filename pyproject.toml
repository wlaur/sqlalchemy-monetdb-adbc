[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sqlalchemy-monetdb-adbc"
version = "0.3.8"
description = "SQLAlchemy dialect for MonetDB over ADBC"
authors = [{ name = "William Laurén", email = "lauren.william.a@gmail.com" }]
requires-python = ">=3.13"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["monetdb", "sqlalchemy", "adbc", "arrow", "database", "dialect"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "adbc-driver-manager>=1.11",
    "adbc-driver-monetdb>=0.12.3",
    "numpy>=2.1",
    "pydantic>=2",
    "pyarrow>=25",
    "sqlalchemy>=2.0.42",
    "tzdata>=2025.2; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "alembic>=1.14",
    "polars>=1.43.1",
    "pyarrow-stubs>=20.0.0.20260625",
    "pymonetdb>=1.9",
    "pyright",
    "pytest>=9",
    "ruff",
]

[project.entry-points."sqlalchemy.dialects"]
"monetdb" = "sqlalchemy_monetdb_adbc.dialect:MonetDBADBCDialect"
"monetdb.adbc" = "sqlalchemy_monetdb_adbc.dialect:MonetDBADBCDialect"
"monetdbs" = "sqlalchemy_monetdb_adbc.dialect:MonetDBADBCDialect"
"monetdbs.adbc" = "sqlalchemy_monetdb_adbc.dialect:MonetDBADBCDialect"

[project.urls]
Homepage = "https://github.com/wlaur/sqlalchemy-monetdb-adbc"
Repository = "https://github.com/wlaur/sqlalchemy-monetdb-adbc"
Issues = "https://github.com/wlaur/sqlalchemy-monetdb-adbc/issues"

[tool.hatch.build.targets.wheel]
packages = ["sqlalchemy_monetdb_adbc"]

[tool.hatch.build.targets.sdist]
include = [
    "/.gitattributes",
    "/.github",
    "/.gitignore",
    "/AGENTS.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/README.md",
    "/compose.yaml",
    "/packaging",
    "/pyproject.toml",
    "/setup.cfg",
    "/sqlalchemy_monetdb_adbc",
    "/suite",
    "/tests",
    "/uv.lock",
]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [".venv", "dist", "build"]
lint.select = [
    "E",
    "W",
    "F",
    "B",
    "I",
    "N",
    "UP",
    "ANN",
    "C4",
    "ISC",
    "ICN",
    "SIM",
    "ARG",
    "PTH",
    "INT",
    "FLY",
    "RUF",
]
# ANN401/ARG002: SQLAlchemy's dialect, compiler and reflection APIs are defined
# with untyped `**kw` and pass arguments that individual hooks ignore. Both are
# fixed by the framework, not by this package.
lint.ignore = ["ANN401", "ARG002", "ISC001"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
include = ["sqlalchemy_monetdb_adbc", "tests", "packaging"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = "error"
useLibraryCodeForTypes = true
enableTypeIgnoreComments = false
strictListInference = true
strictDictionaryInference = true
strictSetInference = true

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
    "integration: requires a running MonetDB server (set MONETDB_TEST_URI)",
    "disconnect: restarts the live MonetDB test container",
]

# PyArrow's dynamic extension and conversion APIs exceed the third-party
# stubs; integration tests exercise those runtime surfaces directly.
[[tool.pyright.executionEnvironments]]
root = "tests"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
